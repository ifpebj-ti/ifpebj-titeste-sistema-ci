name: frontend-pipeline

on:
  pull_request:
    types: [closed]
    branches: ["main"]
    paths:
      - "front/**"

  workflow_dispatch:

env:
  IMAGE_NAME: front-${{ github.event.repository.name }}
  REGISTRY: ghcr.io

jobs:

  # =====================================================
  # 0. PREPARAÇÃO DA TAG (SEM ALTERAÇÕES)
  # =====================================================
  prepare-tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.calc.outputs.new_tag }}
      tipo: ${{ steps.tipo.outputs.tipo }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar GH CLI
        run: sudo apt-get install -y gh

      - name: Extrair tipo de mudança
        id: tipo
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > body.txt

          tipo=""
          if grep -q "\[x\] marco-no-projeto" body.txt; then tipo="marco-no-projeto"
          elif grep -q "\[x\] nova-feature" body.txt; then tipo="nova-feature"
          elif grep -q "\[x\] bug-fix" body.txt; then tipo="bug-fix"
          fi

          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"

      - name: Buscar última TAG
        id: last
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          [ -z "$tag" ] && tag="0.0.0"
          echo "last=$tag" >> "$GITHUB_OUTPUT"

      - name: Calcular nova TAG
        id: calc
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.last.outputs.last }}"

          case "${{ steps.tipo.outputs.tipo }}" in
            bug-fix) patch=$((patch+1)) ;;
            nova-feature) minor=$((minor+1)); patch=0 ;;
            marco-no-projeto) major=$((major+1)); minor=0; patch=0 ;;
          esac

          echo "new_tag=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"


  # =====================================================
  # 1. BUILD + TRIVY + PUSH
  # =====================================================
  docker-build:
    needs: prepare-tag
    runs-on: ubuntu-latest

    env:
      TAG: ${{ needs.prepare-tag.outputs.new_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Adicionar label SOURCE ao Dockerfile
        run: |
          echo "LABEL org.opencontainers.image.source=https://github.com/${{ github.repository }}" >> front/Dockerfile

      - name: Login GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Docker
        run: |
          docker build front \
            -f front/Dockerfile \
            -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${TAG} \
            -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/front-${{ github.event.repository.name }}:${{ env.TAG }}
          format: table
          severity: CRITICAL
          exit-code: 0

      - name: Push Docker
        run: |
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${TAG}
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:latest


  # =====================================================
  # 2. DEPLOY VIA SSH (TUDO EM 1 STEP)
  # =====================================================
  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Deploy na VM
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          DEPLOY_GHCR_USER: ${{ secrets.GHCR_USER }}
          DEPLOY_GHCR_PAT: ${{ secrets.GHCR_PAT }}
          SHOULD_DEPLOY: ${{ secrets.SHOULD_DEPLOY }}
          
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gh jq openssh-client

          echo "📥 Baixando artifacts da infra..."
          mkdir -p infra-data

          RUN_ID=$(gh run list --repo ${{ github.repository }} \
            --workflow "infra-provision.yml" \
            --json databaseId,status,conclusion \
            --jq '.[] | select(.conclusion=="success") | .databaseId' \
          | head -n 1)

          echo "RUN_ID: $RUN_ID"

          gh run download "$RUN_ID" --repo ${{ github.repository }} --dir infra-data

          echo "======= ARQUIVOS DO ARTIFACT ======="
          ls -R infra-data
          echo "===================================="

          echo "🔍 Extraindo IP"
          IP_FILE=$(find infra-data -type f -path "*/vm-ip/*" | head -n 1)
          VM_IP=$(grep -Eo '([0-9]{1,3}\.){3}[0-9]{1,3}' "$IP_FILE")
          echo "VM_IP: $VM_IP"

          echo "🔍 Extraindo chave SSH"
          KEY=$(find infra-data -maxdepth 6 -type f \( -name "*_id_rsa" -o -name "id_rsa" -o -name "*.pem" \) | head -n 1)
          cp "$KEY" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          echo "🔐 Autenticando e fazendo deploy..."
          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key azureuser@$VM_IP bash << EOF
            echo "🔐 Login GHCR..."
            echo "${DEPLOY_GHCR_PAT}" | docker login ghcr.io -u "${DEPLOY_GHCR_USER}" --password-stdin

            cd /opt/sysfac/compose

            echo "📦 Pull"
            docker compose pull

            echo "🚀 Up"
            docker compose up -d --remove-orphans

            echo "🧹 Clean"
            docker image prune -af
          EOF


  # =====================================================
  # 3. RELEASE
  # =====================================================
  release:
    needs: [prepare-tag, docker-build]
    runs-on: ubuntu-latest

    env:
      TAG: ${{ needs.prepare-tag.outputs.new_tag }}
      TIPO: ${{ needs.prepare-tag.outputs.tipo }}

    steps:
      - uses: actions/checkout@v4

      - name: Criar release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: "Release ${{ env.TAG }}"
          generate_release_notes: true
          body: |
            Deploy concluído com sucesso.
            Tipo de mudança: **${{ env.TIPO }}**
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_PAT }}