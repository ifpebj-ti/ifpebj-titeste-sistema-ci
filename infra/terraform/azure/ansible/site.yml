---
- name: Provisionar Docker e subir stack com Compose
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - vault.yml


  vars:
    compose_src: "templates/docker-compose-aplication.yml"     # caminho local (da sua máquina)
    compose_dest_dir: "/opt/sysfac/compose"  # pasta no servidor

    app_env_src: "files/app.env"
    app_env_dest: "{{ compose_dest_dir }}/.env"

    # ===== Watchtower =====
    wt_dir: "/opt/watchtower"                      
    wt_expose_port: true                           
    wt_api_port: 8080                              
    
    wt_api_token: "{{ watchtower_token | default(lookup('password', '/dev/null length=48 chars=ascii_letters,digits')) }}"
    wt_tz: "America/Recife"

  pre_tasks:
    - name: Aguardar conexão SSH
      wait_for_connection:
        timeout: 300

  tasks:
    # --------------------------
    # Docker Engine + Compose
    # --------------------------
    - name: Remover repositórios Docker inválidos (se existirem)
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Remover chave antiga do Docker (se existir)
      file:
        path: /etc/apt/keyrings/docker.gpg
        state: absent

    - name: Atualizar cache APT (repositórios limpos)
      apt:
        update_cache: yes
        
    - name: Instalar pacotes de suporte
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Garantir diretório de keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar e converter chave GPG oficial do Docker
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Adicionar repositório Docker oficial
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu jammy stable
        mode: '0644'

    - name: Atualizar cache APT após adicionar repo
      apt:
        update_cache: yes

    - name: Instalar Docker Engine + CLI + containerd + buildx + compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Habilitar e iniciar Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Adicionar usuário ao grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Criar symlink para binário clássico docker-compose
      file:
        src: /usr/lib/docker/cli-plugins/docker-compose
        dest: /usr/local/bin/docker-compose
        state: link
        force: yes

    - name: Mostrar versões do Docker e Compose
      shell: |
        docker --version
        docker compose version || true
        docker-compose version || true
      register: docker_versions
      changed_when: false

    - name: Exibir versões instaladas
      debug:
        msg: "{{ docker_versions.stdout_lines }}"

    - name: Autenticar no GitHub Container Registry
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ github_user }}"
        password: "{{ github_pat }}"

    # --------------------------
    # Deploy com Compose
    # --------------------------
    - name: Criar diretório do Compose
      file:
        path: "{{ compose_dest_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar docker-compose.yml
      copy:
        src: "{{ compose_src }}"
        dest: "{{ compose_dest_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Copiar arquivo .env da aplicação (se existir)
      copy:
        src: "{{ app_env_src }}"
        dest: "{{ app_env_dest }}"
        mode: "0644"
      ignore_errors: yes

    - name: Subir stack com docker compose (ou docker-compose)
      shell: |
        cd "{{ compose_dest_dir }}"
        if docker compose version >/dev/null 2>&1; then
          docker compose --env-file .env up -d
        else
          docker-compose --env-file .env up -d
        fi
      args:
        chdir: "{{ compose_dest_dir }}"

    # --------------------------
    # Watchtower (webhook)
    # --------------------------
    - name: Criar diretório do Watchtower
      file:
        path: "{{ wt_dir }}"
        state: directory
        mode: "0755"

    - name: Criar .env do Watchtower (token e TZ)
      copy:
        dest: "{{ wt_dir }}/.env"
        mode: "0600"
        content: |
          WT_API_TOKEN={{ wt_api_token }}
          TZ={{ wt_tz }}

    - name: Gerar docker-compose do Watchtower via template
      ansible.builtin.template:
        src: "templates/docker-compose.watchtower.yml.j2"
        dest: "{{ wt_dir }}/docker-compose.yml"
        mode: "0644"

    # (Opcional, recomendado) Validar YAML antes de subir
    - name: Validar docker-compose do Watchtower
      shell: |
        cd "{{ wt_dir }}"
        if docker compose version >/dev/null 2>&1; then
          docker compose -f docker-compose.yml config -q
        else
          docker-compose -f docker-compose.yml config -q
        fi
      args:
        chdir: "{{ wt_dir }}"

    - name: Subir/atualizar Watchtower (docker compose ou docker-compose)
      shell: |
        cd "{{ wt_dir }}"
        if docker compose version >/dev/null 2>&1; then
          docker compose up -d
        else
          docker-compose up -d
        fi
      args:
        chdir: "{{ wt_dir }}"

    - name: Exibir endpoint e token do Watchtower
      debug:
        msg:
          - "Endpoint: {{ 'http://'+ansible_host+':'+wt_api_port|string+'/v1/update' if wt_expose_port else 'http://localhost:8080/v1/update (porta não exposta)' }}"
          - "Token (Authorization: Bearer ...): {{ wt_api_token }}"

    - name: Salvar endpoint e token em arquivos locais para coleta
      copy:
        dest: "/tmp/watchtower_info.txt"
        content: |
          ENDPOINT=http://{{ ansible_host }}:{{ wt_api_port }}/v1/update
          TOKEN={{ wt_api_token }}

