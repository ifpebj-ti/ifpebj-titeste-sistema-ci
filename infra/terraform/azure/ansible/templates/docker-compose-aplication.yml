version: '3.8'

services:
  back-app:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    image: "${BACK_IMAGE}"
    container_name: back-backend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: "${NODE_ENV}"
      DB_CONNECTION: "${DB_CONNECTION}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SECRET_KEY: "${SECRET_KEY}"
    networks:
      - back-network
      - front-back-network
    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back-network

  front-app:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    image: "${FRONT_IMAGE}"
    container_name: front-frontend
    ports:
      - "80:80"
    networks:
      - front-back-network
    depends_on:
      - back-app

networks:
  back-network:
    driver: bridge

  front-back-network:
    driver: bridge

volumes:
  pgdata: